<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#F4F0E6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#08120F" media="(prefers-color-scheme: dark)" />
  <meta name="format-detection" content="telephone=no" />
  <title>رَفِيقِي — رفيقك في العبادة</title>
  <script>
    // Pre-paint theme: React used to apply `.dark` in an effect, so every
    // dark-mode cold start flashed cream for a frame or three. Read the
    // persisted setting synchronously and set the class before first paint.
    try {
      var __s = JSON.parse(localStorage.getItem('myzikr:settings') || 'null');
      var __st = __s && (__s.state || __s);
      if (__st && __st.darkMode !== false) {
        document.documentElement.classList.add('dark');
      }
      if (__st && (__st.palette === 'brass' || __st.palette === 'sage')) {
        document.documentElement.dataset.palette = __st.palette;
      }
    } catch (e) { /* first run / private mode — light default is fine */ }
  </script>
  <!-- UI fonts (Vazirmatn + Amiri) are now self-hosted via @fontsource and
       bundled into the build (see src/main.tsx), so they load offline on the
       device. Only "Amiri Quran" is fetched from the CDN as a nicety when
       online; the Mushaf's real glyphs come from the per-page KFGQPC fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
