<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#145A4D"/>
      <stop offset="55%" stop-color="#0C463C"/>
      <stop offset="100%" stop-color="#062B25"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEFC2" stop-opacity="0.9"/>
      <stop offset="48%" stop-color="#FFD980" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFD980" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4DD93"/>
      <stop offset="55%" stop-color="#E2C57A"/>
      <stop offset="100%" stop-color="#C99B3F"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="476" cy="512" r="206" fill="white"/>
      <circle cx="570" cy="470" r="176" fill="black"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- inner gold hairline frame -->
  <rect x="64" y="64" width="896" height="896" rx="180" fill="none" stroke="#C99B3F" stroke-width="6" opacity="0.5"/>

  <!-- star sparkles -->
  <g fill="#E9C877" opacity="0.25">
    <circle cx="220" cy="250" r="6"/>
    <circle cx="804" cy="300" r="7"/>
    <circle cx="300" cy="820" r="6"/>
    <circle cx="770" cy="800" r="5"/>
  </g>

  <!-- warm glow halo -->
  <ellipse cx="512" cy="500" rx="290" ry="300" fill="url(#glow)"/>

  <!-- crescent moon -->
  <circle cx="476" cy="512" r="206" fill="url(#gold)" mask="url(#crescent)"/>

  <!-- five-pointed star in the crescent's opening -->
  <path
    d="M664 392 L681.6 442 L734.5 443.3 L692.4 475.3 L708 526.3 L664 496.4 L620 526.3 L635.6 475.3 L593.5 443.3 L646.4 442 Z"
    fill="url(#gold)"/>

  <!-- sparkles -->
  <g fill="#F4DD93">
    <path d="M356 372 l8 19 19 8 -19 8 -8 19 -8 -19 -19 -8 19 -8 Z"/>
    <path d="M388 648 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 Z"/>
  </g>
</svg>
